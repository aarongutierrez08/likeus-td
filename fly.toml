# Likeus TD room server on Fly.io. Deploy from the repo root: `fly deploy`.
app = "likeus-td"
primary_region = "gru"

[build]
  dockerfile = "packages/server/Dockerfile"

[env]
  PORT = "2567"
  GITHUB_REPO = "aarongutierrez08/likeus-td"
  ACCOUNTS_DB = "/data/accounts.db"
  PUBLIC_URL = "https://likeus-td.fly.dev"
  CLIENT_ORIGINS = "https://likeus-td.pages.dev"

# Accounts live in SQLite on this volume (ADR 018). Create it once: `fly volumes create accounts --region gru --size 1`.
[mounts]
  source = "accounts"
  destination = "/data"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
